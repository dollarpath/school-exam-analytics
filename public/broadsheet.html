<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Broadsheet — School Exam Analytics</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="broadsheet" style="display:flex;flex-direction:column;min-height:100vh;">
<header class="topbar no-print"><div class="topbar-inner">
  <div id="php-brand"></div>
  <div class="topbar-actions" id="php-user"></div>
</div></header>
<nav class="navbar no-print"><div class="nav-inner" id="ph-nav"></div></nav>

<main class="page">
  <h1 style="margin:0 0 6px">Class Broadsheet</h1>
  <p class="text-muted text-small" style="margin:0 0 18px">Pivot marks for a class and exam, with totals, points, averages and positions.</p>

  <div class="card no-print">
    <div class="filter-bar">
      <div class="field"><label>Class</label><select id="selClass"><option value="">— choose —</option></select></div>
      <div class="field"><label>Exam</label><select id="selExam"></select></div>
      <button class="btn btn-primary" id="loadBtn">View broadsheet</button>
    </div>
  </div>

  <div id="sheetArea"><div class="loading-block">Select a class and exam.</div></div>
</main>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () { await App.boot('broadsheet'); await init(); });

let sortKey = 'position', sortDir = 1, search = '';
let BROAD = null;

async function init() {
  const [classes, exams, activeExam] = await Promise.all([App.api('/api/classes'), App.api('/api/exams'), App.api('/api/exams/active')]);
  document.getElementById('selClass').innerHTML = '<option value="">— choose —</option>' + classes.classes.map(cl => `<option value="${cl.id}">${App.escapeHtml(cl.display_name)}</option>`).join('');
  document.getElementById('selExam').innerHTML = exams.exams.map(e => `<option value="${e.id}">${App.escapeHtml(e.label)}</option>`).join('');
  if (activeExam.exam) document.getElementById('selExam').value = activeExam.exam.id;
  document.getElementById('loadBtn').addEventListener('click', load);
}

async function load() {
  const classId = document.getElementById('selClass').value, examId = document.getElementById('selExam').value;
  if (!classId || !examId) return App.toast('Choose class and exam', 'warn');
  document.getElementById('sheetArea').innerHTML = '<div class="loading-block">Loading broadsheet…</div>';
  BROAD = await App.api(`/api/broadsheet/${classId}/${examId}`);
  draw();
}

function draw() {
  if (!BROAD) return;
  const el = document.getElementById('sheetArea');
  const subjects = BROAD.subjects;
  const rows = [...BROAD.rows];
  // search
  const filtered = rows.filter(r => !search || r.name.toLowerCase().includes(search.toLowerCase()) || r.adm.toLowerCase().includes(search.toLowerCase()));
  // sort
  if (sortKey === 'position' || sortKey === 'ttmks' || sortKey === 'points' || sortKey === 'avg') {
    filtered.sort((a,b) => ((a[sortKey]==null?Infinity:a[sortKey]) - (b[sortKey]==null?Infinity:b[sortKey])) * sortDir);
  }

  let head = `<th class="num">#</th><th>ADM</th><th>Student</th>`;
  subjects.forEach(s => head += `<th class="num" title="${s.full_name}">${App.escapeHtml(s.code)}</th>`);
  head += `<th class="num">TT MKS</th><th class="num">POINTS</th><th class="num">AVG</th><th class="num">POS</th>`;

  let body = filtered.map((r, i) => {
    let cells = subjects.map(s => `<td class="num">${r.subjectScores[s.code] != null ? r.subjectScores[s.code] : '<span class="text-muted">—</span>'}</td>`).join('');
    return `<tr>
      <td class="num">${i+1}</td>
      <td>${App.escapeHtml(r.adm)}</td>
      <td>${App.escapeHtml(r.name)}</td>${cells}
      <td class="num font-bold">${r.ttmks}</td>
      <td class="num font-bold">${r.points}</td>
      <td class="num">${r.avg != null ? r.avg : '—'}</td>
      <td class="num"><span class="badge ${r.position <= 3 ? 'badge-success' : 'badge-neutral'}">${r.position}</span></td>
    </tr>`;
  }).join('');

  const summary = BROAD.summary.map(s => `
    <tr><td><strong>${App.escapeHtml(s.code)}</strong></td><td>${App.escapeHtml(s.full_name)}</td>
      <td class="num">${s.count}</td><td class="num">${App.fmtNum(s.avg)}</td>
      <td class="num">${s.max ?? '—'}</td><td class="num">${s.min ?? '—'}</td></tr>`).join('');

  el.innerHTML = `
    <div class="card no-print">
      <div class="flex-between mb-1">
        <div><strong>${App.escapeHtml(BROAD.class.display_name)}</strong> · ${App.escapeHtml(BROAD.exam.label)}</div>
        <div class="flex gap-1">
          <input type="search" id="searchBox" placeholder="Search student…" style="max-width:220px">
          <select id="sortSel" style="max-width:180px">
            <option value="position" ${sortKey==='position'?'selected':''}>Sort: Position</option>
            <option value="ttmks" ${sortKey==='ttmks'?'selected':''}>Sort: Total marks</option>
            <option value="points" ${sortKey==='points'?'selected':''}>Sort: Points</option>
            <option value="avg" ${sortKey==='avg'?'selected':''}>Sort: Average</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="sortDirBtn">${sortDir===1?'↑ Asc':'↓ Desc'}</button>
          <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Print</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:none" class="print-header">
        <h2>${App.escapeHtml(BROAD.class.display_name)} — Class Broadsheet</h2>
        <p>${App.escapeHtml(BROAD.exam.label)} · ${App.escapeHtml(BROAD.exam.year || '')} ${App.escapeHtml(BROAD.exam.term_label||'')}</p>
      </div>
      <div class="table-wrap"><table class="data-table compact-table" id="bsTable">
        <thead><tr>${head}</tr></thead><tbody>${body}</tbody>
      </table></div>
      <div class="text-small text-muted mt-1">${filtered.length} students · ${subjects.length} subjects</div>
    </div>

    <div class="card">
      <h2 class="card-title">Subject Analysis</h2>
      <div class="table-wrap"><table class="data-table compact-table">
        <thead><tr><th>Code</th><th>Subject</th><th class="num">Entered</th><th class="num">Class Avg</th><th class="num">Max</th><th class="num">Min</th></tr></thead>
        <tbody>${summary}</tbody>
      </table></div>
    </div>
    <div class="page-break"></div>`;

  document.getElementById('searchBox').addEventListener('input', e => { search = e.target.value; draw(); });
  document.getElementById('sortSel').addEventListener('change', e => { sortKey = e.target.value; draw(); });
  document.getElementById('sortDirBtn').addEventListener('click', e => { sortDir *= -1; e.target.textContent = sortDir===1?'↑ Asc':'↓ Desc'; draw(); });
}
</script>
</body>
</html>
