<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Generator — School Exam Analytics</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .report-page { background: var(--primary); color: #fff; padding: 22px; text-align: center; }
  .report-page .logo { width: 56px; height: 56px; border-radius: 12px; background: #fff; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .report-page .logo img { width:100%; height:100%; object-fit:contain; }
  .report-page .logo .no-logo { font-weight:800; font-size:24px; color: var(--primary); }
  .report-page h1 { margin:0 0 4px; font-size:22px; }
  .report-page p { margin:0; font-size:13px; opacity:.92; }
  .a4 { width: 100%; max-width: 820px; margin: 0 auto; background:#fff; color:#1f2937; position: relative; overflow:hidden; }
  .a4 .watermark { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:90px; font-weight:900; color:rgba(0,0,0,0.04); transform:rotate(-24deg); pointer-events:none; z-index:0; }
  .a4 .content { position:relative; z-index:1; padding: 34px 36px; }
  .a4 .border-frame { position:absolute; inset:10px; border:2px solid var(--primary); pointer-events:none; z-index:2; }
  .a4 .border-frame2 { position:absolute; inset:14px; border:1px solid rgba(0,0,0,0.12); pointer-events:none; z-index:2; }
  .report-header { display:flex; justify-content:space-between; align-items:center; gap:16px; border-bottom:3px solid var(--primary); padding-bottom:12px; }
  .report-header .h-name { font-size:18px; font-weight:800; color: var(--primary); }
  .report-header .h-sub { font-size:12px; color:#555; }
  .report-header img { max-height:72px; }
  .student-line { display:flex; flex-wrap:wrap; gap:14px; border:1px solid #ddd; border-radius:8px; padding:12px 14px; margin:16px 0; font-size:13px; }
  .student-line .item { flex:1; min-width:150px; }
  .student-line .lbl { font-size:10px; text-transform:uppercase; color:#888; letter-spacing:.4px; }
  .student-line .val { font-weight:700; }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th, .tbl td { border:1px solid #cfd8e3; padding:7px 8px; }
  .tbl th { background: var(--primary-soft); color:var(--primary-dark); font-size:11px; text-transform:uppercase; }
  .tbl td.num, .tbl th.num { text-align:center; }
  .tbl tr.total-row td { background:var(--primary-soft); font-weight:700; }
  .sig-wrap { display:flex; justify-content:space-between; gap:20px; margin-top:44px; }
  .sig { flex:1; text-align:center; }
  .sig .line { border-top:1px solid #333; margin-top:46px; padding-top:5px; font-size:12px; }
  .career { margin-top:20px; }
  .career h4 { font-size:13px; text-transform:uppercase; color:var(--primary); letter-spacing:.4px; margin:0 0 8px; }
  .career-row { display:grid; grid-template-columns:90px 1fr 60px; gap:8px; align-items:center; margin-bottom:5px; font-size:12px; }
  .career-row .name { text-align:right; }
  .career-bar { height:14px; background:#eef2f7; border-radius:3px; position:relative; }
  .career-fill { height:100%; border-radius:3px; position:absolute; left:0; top:0; }
  .career-bar .mark { position:absolute; top:-2px; bottom:-2px; width:2px; background:#333; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; font-size:11px; }
  .legend .lg { display:flex; align-items:center; gap:5px; }
  .legend .sw { width:14px; height:14px; border-radius:3px; }
  .footer-note { font-size:11px; color:#777; margin-top:18px; text-align:center; }
  .holidays { font-size:11px; color:#555; margin-top:6px; text-align:center; }
  @media print { .a4 { box-shadow:none; } body { background:#fff; } .report-controls { display:none; } }
</style>
</head>
<body data-page="report" style="display:flex;flex-direction:column;min-height:100vh;">
<header class="topbar no-print"><div class="topbar-inner">
  <div id="php-brand"></div>
  <div class="topbar-actions" id="php-user"></div>
</div></header>
<nav class="navbar no-print"><div class="nav-inner" id="ph-nav"></div></nav>

<main class="page">
  <h1 style="margin:0 0 6px">Report Generator</h1>
  <p class="text-muted text-small" style="margin:0 0 18px">Generate an A4 printable report for a student — single exam, term average, or year-end average.</p>

  <div class="card report-controls">
    <div class="filter-bar">
      <div class="field"><label>Student</label><select id="selStudent"></select></div>
      <div class="field"><label>Report mode</label>
        <select id="selMode"><option value="single">Single exam</option><option value="term_avg">Term average</option><option value="year_end">Year-end average</option></select></div>
      <div class="field" id="examField"><label>Exam</label><select id="selExam"></select></div>
      <div class="field" id="termField" style="display:none"><label>Term</label><select id="selTerm"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select></div>
      <button class="btn btn-primary" id="genBtn">Generate</button>
      <button class="btn btn-secondary" id="printBtn">🖨 Print report</button>
    </div>
  </div>

  <div id="reportArea"><div class="loading-block">Choose a student and generate the report.</div></div>
</main>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () { await App.boot('report'); await init(); });

async function loadMeta(selStudent) {
  const [classes] = await Promise.all([App.api('/api/classes')]);
}

async function init() {
  const [students, exams, classes] = await Promise.all([App.api('/api/students'), App.api('/api/exams'), App.api('/api/classes')]);
  document.getElementById('selExam').innerHTML = exams.exams.map(e => `<option value="${e.id}">${App.escapeHtml(e.label)}</option>`).join('');
  const studSel = document.getElementById('selStudent');
  // group students by class
  const byClass = {};
  students.students.forEach(s => { const key = s.class || 'Unassigned'; (byClass[key]=byClass[key]||[]).push(s); });
  let opts = '';
  for (const [cls, arr] of Object.entries(byClass)) {
    opts += `<optgroup label="${App.escapeHtml(cls)}">` + arr.map(s => `<option value="${s.id}">${App.escapeHtml(s.full_name)} (${App.escapeHtml(s.adm)})</option>`).join('') + '</optgroup>';
  }
  studSel.innerHTML = opts;

  document.getElementById('selMode').addEventListener('change', (e) => {
    const m = e.target.value;
    document.getElementById('examField').style.display = m==='single' ? 'flex':'none';
    document.getElementById('termField').style.display = m==='term_avg' ? 'flex':'none';
  });
  document.getElementById('genBtn').addEventListener('click', generate);
  document.getElementById('printBtn').addEventListener('click', () => window.print());
}

async function generate() {
  const studentId = document.getElementById('selStudent').value;
  const mode = document.getElementById('selMode').value;
  if (!studentId) return App.toast('Choose a student','warn');
  let qs = `mode=${mode}`;
  if (mode === 'single') qs += `&exam_id=${document.getElementById('selExam').value}`;
  if (mode === 'term_avg') qs += `&term_number=${document.getElementById('selTerm').value}`;
  qs += `&year=${(App.state.init && App.state.init.config.academic_year) || 2026}`;
  document.getElementById('reportArea').innerHTML = '<div class="loading-block">Generating report…</div>';
  const r = await App.api(`/api/report/${studentId}?${qs}`);
  render(r, mode);
}

function render(r, mode) {
  const el = document.getElementById('reportArea');
  const school = r.school || {};
  const hdr = r.header_context || {};
  const student = r.student;

  // column definitions based on mode
  let cols = [];
  if (mode === 'single') cols = [{key:'score', label:'Marks'}];
  else if (mode === 'term_avg') cols = [{key:'mid', label:'Mid'},{key:'end', label:'End'},{key:'avg', label:'Avg'}];
  else cols = [{key:'term1', label:'T1'},{key:'term2', label:'T2'},{key:'term3', label:'T3'},{key:'year', label:'Year'}];

  const tbl = r.subjects.map((s, i) => {
    const cells = cols.map(c => `<td class="num">${s.columns[c.key] != null ? s.columns[c.key] : '<span style="opacity:.4">—</span>'}</td>`).join('');
    return `<tr><td class="num">${i+1}</td><td>${App.escapeHtml(s.full_name)}<div class="text-muted" style="font-size:11px">${App.escapeHtml(s.code)}</div></td>${cells}
      <td class="num font-bold">${s.final != null ? (Number.isInteger(s.final)? s.final : s.final.toFixed(1)) : '—'}</td>
      <td class="num"><span class="grade-chip">${App.escapeHtml(s.grade || '—')}</span></td>
      <td class="num">${s.points}</td></tr>`;
  }).join('');

  const colHead = cols.map(c => `<th class="num">${c.label}</th>`).join('');

  // career pathway bars
  const maxScore = 100;
  const careerBars = r.subjects.map(s => {
    const score = s.final;
    const color = gradeColor(s.band || null);
    const pct = score != null ? (score/maxScore*100) : 0;
    return `<div class="career-row">
      <div class="name">${App.escapeHtml(s.code)}</div>
      <div class="career-bar">
        ${score != null ? `<div class="career-fill" style="width:${pct}%;background:${color}"></div>` : ''}
        <div class="mark" style="left:50%"></div>
      </div>
      <div class="num" style="text-align:left">${score != null ? Math.round(score) : '—'}</div>
    </div>`;
  }).join('');

  // legend from subject grades
  const grades = ['EE1','EE2','ME1','ME2','AE1','AE2','BE1','BE2'];
  const legend = grades.map(g => `<span class="lg"><span class="sw" style="background:${gradeColor(g)}"></span>${g}</span>`).join('');

  const logoHtml = school.logo_path ? `<img src="${school.logo_path}">` : '';
  const remarkTone = r.remarks && r.remarks.tone;

  el.innerHTML = `
  <div class="a4">
    <div class="border-frame"></div>
    <div class="border-frame2"></div>
    <div class="watermark">${App.escapeHtml((school.name||'').split(' ').slice(0,2).join(' '))}</div>
    <div class="content">
      <div class="report-header">
        <div>
          <div class="h-name">${App.escapeHtml(school.name || 'School')}</div>
          <div class="h-sub">${App.escapeHtml(school.motto || '')}</div>
          <div class="h-sub">${App.escapeHtml(school.address || '')}</div>
        </div>
        <div class="text-center">${logoHtml}</div>
      </div>

      <div class="student-line">
        <div class="item"><div class="lbl">Student</div><div class="val">${App.escapeHtml(student.full_name)}</div></div>
        <div class="item"><div class="lbl">ADM No.</div><div class="val">${App.escapeHtml(student.adm)}</div></div>
        <div class="item"><div class="lbl">Class</div><div class="val">${App.escapeHtml(student.class_name || '—')}</div></div>
        <div class="item"><div class="lbl">${hdr.title}</div><div class="val">${App.escapeHtml(r.year || '')}</div></div>
        <div class="item"><div class="lbl">Position</div><div class="val">${r.position ? r.position + ' / ' + (r.class_size || '?') : '—'}</div></div>
      </div>

      <table class="tbl">
        <thead><tr><th class="num">#</th><th>Subject</th>${colHead}<th class="num">Final/Avg</th><th class="num">Grade</th><th class="num">P/L</th></tr></thead>
        <tbody>${tbl}
          <tr class="total-row">
            <td colspan="${3+cols.length}">TOTAL (${r.totals.graded} subjects)</td>
            <td class="num">${r.totals.avg != null ? (Number.isInteger(r.totals.avg)? r.totals.avg : r.totals.avg.toFixed(1)) : '—'}</td>
            <td class="num">—</td>
            <td class="num">${r.totals.points}</td>
          </tr>
        </tbody>
      </table>

      <div class="career">
        <h4>Career Pathway Analysis</h4>
        <div class="career-row"><div class="name"></div><div class="career-bar" style="height:4px"><div class="mark" style="left:50%"></div></div><div class="num" style="text-align:left;font-size:11px;color:#888">50%</div></div>
        ${careerBars}
        <div class="legend">${legend}</div>
      </div>

      <div style="margin-top:18px;font-size:13px">
        <strong>Remarks:</strong> <em style="color:${remarkTone==='excellent'?'var(--secondary)':remarkTone==='poor'?'var(--danger)':''}">${App.escapeHtml(r.remarks.text)}</em>
      </div>

      <div class="holidays">Next holiday: — · Term dates: —</div>

      <div class="sig-wrap">
        <div class="sig"><div class="line">Class Teacher's Signature</div></div>
        <div class="sig"><div class="line">Head of Institution</div></div>
        <div class="sig"><div class="line">Parent's Signature</div></div>
      </div>

      <div class="footer-note">Generated by School Exam Analytics System · ${App.escapeHtml(school.name||'')}</div>
    </div>
  </div>
  <div class="print-btn-zone no-print"><button class="btn btn-primary" onclick="window.print()">🖨 Print this report</button></div>`;
}

function gradeColor(band) {
  const c = { EE1:'#1e7a3a', EE2:'#2e9d53', ME1:'#68a822', ME2:'#a8c136', AE1:'#d4a017', AE2:'#d9811c', BE1:'#c05c15', BE2:'#a53e20' };
  return c[band] || '#94a3b8';
}
</script>
</body>
</html>
