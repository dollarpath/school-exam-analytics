<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Viewer — School Exam Analytics</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="data" style="display:flex;flex-direction:column;min-height:100vh;">
<header class="topbar no-print"><div class="topbar-inner">
  <div id="php-brand"></div>
  <div class="topbar-actions" id="php-user"></div>
</div></header>
<nav class="navbar no-print"><div class="nav-inner" id="ph-nav"></div></nav>

<main class="page">
  <h1 style="margin:0 0 6px">Data Viewer</h1>
  <p class="text-muted text-small" style="margin:0 0 18px">Browse raw marks and class performance data. All tables are printable.</p>

  <div class="tabs no-print">
    <button class="tab active" data-tab="marks">Mark List</button>
    <button class="tab" data-tab="broadsheet">Broadsheet & Performance</button>
  </div>

  <div class="card no-print">
    <div class="filter-bar">
      <div class="field"><label>Class</label><select id="selClass"><option value="">— choose —</option></select></div>
      <div class="field"><label>Exam</label><select id="selExam"></select></div>
      <button class="btn btn-primary" id="loadBtn">Show data</button>
      <button class="btn btn-secondary" id="printBtn">🖨 Print</button>
    </div>
  </div>

  <div id="tab-marks"><div class="loading-block">Select a class and exam.</div></div>
  <div id="tab-broadsheet" class="hidden"><div class="loading-block">Switch to broadsheet view.</div></div>
</main>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function () { await App.boot('data'); await init(); });
let DATA = null;

async function init() {
  const [classes, exams, activeExam] = await Promise.all([App.api('/api/classes'), App.api('/api/exams'), App.api('/api/exams/active')]);
  document.getElementById('selClass').innerHTML = '<option value="">— choose —</option>' + classes.classes.map(cl => `<option value="${cl.id}">${App.escapeHtml(cl.display_name)}</option>`).join('');
  document.getElementById('selExam').innerHTML = exams.exams.map(e => `<option value="${e.id}">${App.escapeHtml(e.label)}</option>`).join('');
  if (activeExam.exam) document.getElementById('selExam').value = activeExam.exam.id;
  document.getElementById('loadBtn').addEventListener('click', load);
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-marks').classList.toggle('hidden', t.dataset.tab !== 'marks');
    document.getElementById('tab-broadsheet').classList.toggle('hidden', t.dataset.tab !== 'broadsheet');
  }));
}

async function load() {
  const classId = document.getElementById('selClass').value, examId = document.getElementById('selExam').value;
  if (!classId || !examId) return App.toast('Choose class and exam', 'warn');
  DATA = await App.api(`/api/broadsheet/${classId}/${examId}`);
  renderMarks();
  renderBroadsheet();
}

function renderMarks() {
  const el = document.getElementById('tab-marks');
  const d = DATA;
  const subjects = d.subjects;
  // Flatten marks per student per subject
  let rows = [];
  d.rows.forEach(r => {
    subjects.forEach(s => {
      const sc = r.subjectScores[s.code];
      if (sc != null) rows.push({ adm: r.adm, name: r.name, subj: s.code, subjName: s.full_name, score: sc, pos: r.position, point: r.points });
    });
  });
  el.innerHTML = `
    <div class="card">
      <h2 class="card-title">Mark List</h2>
      <p class="card-sub">${App.escapeHtml(d.class.display_name)} · ${App.escapeHtml(d.exam.label)} — ${rows.length} marks recorded.</p>
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>ADM</th><th>Student</th><th>Subject</th><th class="num">Marks</th><th class="num">Class Pos</th><th class="num">Points</th></tr></thead>
        <tbody>${rows.map((r,i) => `<tr><td>${App.escapeHtml(r.adm)}</td><td>${App.escapeHtml(r.name)}</td><td>${App.escapeHtml(r.subjName)}</td><td class="num">${r.score}</td><td class="num">${r.pos}</td><td class="num">${r.point}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

function renderBroadsheet() {
  const el = document.getElementById('tab-broadsheet');
  const d = DATA;
  const subjects = d.subjects;
  let head = '<th>Student</th>' + subjects.map(s => `<th class="num">${App.escapeHtml(s.code)}</th>`).join('') + '<th class="num">TT</th><th class="num">Avg</th><th class="num">Pos</th>';
  let body = d.rows.map(r => `<tr><td>${App.escapeHtml(r.name)}</td>${subjects.map(s => `<td class="num">${r.subjectScores[s.code]!=null?r.subjectScores[s.code]:'—'}</td>`).join('')}<td class="num font-bold">${r.ttmks}</td><td class="num">${r.avg!=null?r.avg:'—'}</td><td class="num">${r.position}</td></tr>`).join('');
  // class performance summary
  const classAvg = d.summary.length ? d.summary.reduce((a,x)=>a+x.avg,0)/d.summary.length : 0;
  const summary2 = d.summary.map(s => `<tr><td><strong>${App.escapeHtml(s.code)}</strong></td><td>${App.escapeHtml(s.full_name)}</td><td class="num">${s.count}</td><td class="num">${App.fmtNum(s.avg)}</td><td class="num">${s.max??'—'}</td><td class="num">${s.min??'—'}</td><td class="num">${s.avg!=null && s.avg>classAvg?'▲':'▼'}</td></tr>`).join('');

  el.innerHTML = `
    <div class="card">
      <h2 class="card-title">Class Performance — Broadsheet</h2>
      <p class="card-sub">${App.escapeHtml(d.class.display_name)} · ${App.escapeHtml(d.exam.label)}</p>
      <div class="table-wrap"><table class="data-table compact-table">
        <thead><tr>${head}</tr></thead><tbody>${body}</tbody>
      </table></div>
    </div>
    <div class="card">
      <h2 class="card-title">Subject Analysis</h2>
      <div class="table-wrap"><table class="data-table compact-table">
        <thead><tr><th>Code</th><th>Subject</th><th class="num">Entered</th><th class="num">Avg</th><th class="num">Max</th><th class="num">Min</th><th class="num">v Class</th></tr></thead>
        <tbody>${summary2}</tbody>
      </table></div>
      <div class="text-small text-muted mt-1">Class mean across subjects: ${App.fmtNum(classAvg)}</div>
    </div>
    <div class="page-break"></div>`;
}
</script>
</body>
</html>
